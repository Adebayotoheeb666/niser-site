name: CI/CD — NISER Digital Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─── 1. Lint & Type-check ───────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ─── 2. Build ───────────────────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: lint
    env:
      # Provide stub env vars so the build doesn't crash without real services
      NEXT_PUBLIC_CMS_URL: http://localhost:10003/wp-json/niser/v1
      NEXT_PUBLIC_SITE_URL: https://niser.gov.ng
      NEXT_PUBLIC_MATOMO_URL: ''
      NEXT_PUBLIC_MATOMO_SITE_ID: '1'
      REVALIDATION_SECRET: ci-stub-secret
      WEBHOOK_SECRET: ci-stub-secret
      CLOUDFLARE_ZONE_ID: ''
      CLOUDFLARE_API_TOKEN: ''
      ISR_REVALIDATE_TOKEN: ci-stub-secret
      ELASTICSEARCH_URL: http://localhost:9200
      QDRANT_URL: http://localhost:6333
      OLLAMA_URL: http://localhost:11434
      OLLAMA_MODEL: llama3
      BREVO_API_KEY: ''
      FIREBASE_SERVICE_ACCOUNT: '{}'
      SENTRY_DSN: ''
      NEXT_PUBLIC_SENTRY_DSN: ''
      NLLB_SERVICE_URL: http://localhost:8003
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 3

  # ─── 3. Smoke tests ─────────────────────────────────────────────────────────
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next/

      - name: Install dependencies
        run: npm ci

      - name: Start server (background)
        run: |
          npm start &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          PORT: 3000
          NODE_ENV: production
          NEXT_PUBLIC_CMS_URL: http://localhost:10003/wp-json/niser/v1

      - name: Run smoke tests
        run: node scripts/smoke-tests.js
        env:
          BASE_URL: http://localhost:3000
          WEBHOOK_SECRET: ci-stub-secret

      - name: Stop server
        if: always()
        run: kill $SERVER_PID || true

  # ─── 4. Deploy (main branch only) ───────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://niser.gov.ng
            NEXT_PUBLIC_MATOMO_URL=${{ secrets.NEXT_PUBLIC_MATOMO_URL }}
            NEXT_PUBLIC_MATOMO_SITE_ID=${{ secrets.NEXT_PUBLIC_MATOMO_SITE_ID }}

      - name: Deploy via SSH to InterServer VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/niser
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest
            docker compose up -d --no-deps --force-recreate app
            docker system prune -f
            echo "✅ Deployed commit ${{ github.sha }} to production"

      - name: Purge Cloudflare cache after deploy
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
