name: niser_mobile
description: Official NISER mobile app — Android + iOS client for the NISER digital platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  add_2_calendar: ^3.1.1
  sentry_flutter: ^9.0.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^19.0.0
  pdfrx: ^2.4.7
  cached_network_image: ^3.4.1
  share_plus: ^12.0.0
  flutter_html: ^3.0.0-beta.2
  flutter_markdown: ^0.7.7+1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.6.0
  freezed: ^3.2.0
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true
  generate: true
